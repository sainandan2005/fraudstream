global:
  scrape_interval: 5s

scrape_configs:
  - job_name: detector
    static_configs:
      - targets: ["detector:9100"]
  - job_name: ml-scorer
    static_configs:
      - targets: ["ml-scorer:9101"]
  - job_name: alerts-api
    metrics_path: /metrics
    static_configs:
      - targets: ["alerts-api:8000"]
