<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7d9b"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9cf9"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1240" height="720" fill="#0b0f17"/>
  <text x="32" y="46" fill="#e2e8f0" font-size="24" font-weight="700">FraudStream</text>
  <text x="196" y="46" fill="#7c8aa5" font-size="14">real-time fraud detection · Kafka · Redis · Postgres</text>
  <rect x="32" y="58" width="1176" height="3" rx="1.5" fill="url(#hdr)"/>

  <!-- ============ row 1 ============ -->
  <rect x="32" y="110" width="190" height="112" rx="10" fill="#131a28" stroke="#2a3a55"/>
  <text x="127" y="142" fill="#4f9cf9" font-size="16" font-weight="700" text-anchor="middle">generator</text>
  <text x="127" y="164" fill="#8fa0ba" font-size="12" text-anchor="middle">20 txn/s · 5,000 cards</text>
  <text x="127" y="182" fill="#8fa0ba" font-size="12" text-anchor="middle">7 Indian metros</text>
  <text x="127" y="200" fill="#8fa0ba" font-size="12" text-anchor="middle">5% planted fraud</text>

  <rect x="310" y="96" width="200" height="140" rx="10" fill="#161225" stroke="#453a70"/>
  <text x="410" y="126" fill="#a78bfa" font-size="16" font-weight="700" text-anchor="middle">Apache Kafka</text>
  <rect x="326" y="140" width="168" height="26" rx="5" fill="#0d1320" stroke="#2a2347"/>
  <text x="410" y="158" fill="#c4b5fd" font-size="12" text-anchor="middle">transactions.v1 · 6 parts</text>
  <rect x="326" y="172" width="168" height="26" rx="5" fill="#0d1320" stroke="#2a2347"/>
  <text x="410" y="190" fill="#c4b5fd" font-size="12" text-anchor="middle">fraud-scores.v1</text>
  <rect x="326" y="204" width="168" height="26" rx="5" fill="#0d1320" stroke="#2a2347"/>
  <text x="410" y="222" fill="#c4b5fd" font-size="12" text-anchor="middle">fraud-alerts.v1</text>

  <rect x="590" y="110" width="230" height="112" rx="10" fill="#101d18" stroke="#2c5a49"/>
  <text x="705" y="142" fill="#34d399" font-size="16" font-weight="700" text-anchor="middle">detector</text>
  <text x="705" y="164" fill="#8fa0ba" font-size="12" text-anchor="middle">8 weighted rules → risk ≥ 70</text>
  <text x="705" y="182" fill="#8fa0ba" font-size="12" text-anchor="middle">amount · velocity · geo · anomaly</text>
  <text x="705" y="200" fill="#8fa0ba" font-size="12" text-anchor="middle">SETNX dedup · manual commits</text>

  <rect x="880" y="110" width="180" height="112" rx="10" fill="#131a28" stroke="#2a3a55"/>
  <text x="970" y="142" fill="#ffb020" font-size="16" font-weight="700" text-anchor="middle">alerts-api</text>
  <text x="970" y="164" fill="#8fa0ba" font-size="12" text-anchor="middle">FastAPI · :8000</text>
  <text x="970" y="182" fill="#8fa0ba" font-size="12" text-anchor="middle">◀ fraud-alerts.v1</text>
  <text x="970" y="200" fill="#8fa0ba" font-size="12" text-anchor="middle">labels · trace · stats</text>

  <rect x="1100" y="110" width="108" height="112" rx="10" fill="#131a28" stroke="#2a3a55"/>
  <text x="1154" y="142" fill="#ff5d5d" font-size="15" font-weight="700" text-anchor="middle">console</text>
  <text x="1154" y="164" fill="#8fa0ba" font-size="12" text-anchor="middle">live alerts</text>
  <text x="1154" y="182" fill="#8fa0ba" font-size="12" text-anchor="middle">India map</text>
  <text x="1154" y="200" fill="#8fa0ba" font-size="12" text-anchor="middle">card tracing</text>

  <!-- ============ row 2 ============ -->
  <rect x="310" y="330" width="200" height="160" rx="10" fill="#1a1410" stroke="#573322"/>
  <text x="410" y="360" fill="#f97316" font-size="16" font-weight="700" text-anchor="middle">Redis</text>
  <text x="410" y="380" fill="#9aa7bd" font-size="12" text-anchor="middle">online feature store</text>
  <text x="326" y="404" fill="#8fa0ba" font-size="12">• ZSET sliding windows</text>
  <text x="326" y="422" fill="#8fa0ba" font-size="12">• Welford running stats</text>
  <text x="326" y="440" fill="#8fa0ba" font-size="12">• geo profile · deny-lists</text>
  <text x="326" y="458" fill="#8fa0ba" font-size="12">• txn_id dedup (SETNX)</text>

  <rect x="590" y="330" width="230" height="120" rx="10" fill="#171327" stroke="#453a70"/>
  <text x="705" y="360" fill="#c084fc" font-size="16" font-weight="700" text-anchor="middle">ml-scorer</text>
  <text x="705" y="382" fill="#8fa0ba" font-size="12" text-anchor="middle">HistGradientBoosting (trained)</text>
  <text x="705" y="400" fill="#8fa0ba" font-size="12" text-anchor="middle">or heuristic fallback · own group</text>
  <text x="705" y="418" fill="#8fa0ba" font-size="12" text-anchor="middle">independent feature replicas</text>

  <rect x="880" y="330" width="180" height="120" rx="10" fill="#101720" stroke="#2c4a68"/>
  <text x="970" y="360" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="middle">PostgreSQL</text>
  <text x="970" y="382" fill="#8fa0ba" font-size="12" text-anchor="middle">alerts · source of truth</text>
  <text x="970" y="400" fill="#8fa0ba" font-size="12" text-anchor="middle">analyst labels</text>
  <text x="970" y="418" fill="#8fa0ba" font-size="12" text-anchor="middle">training_examples</text>

  <!-- ============ row 3: observability ============ -->
  <rect x="590" y="510" width="470" height="86" rx="10" fill="#0f1512" stroke="#2c5a49"/>
  <text x="825" y="540" fill="#35c28f" font-size="14" font-weight="700" text-anchor="middle">Prometheus :9090 → Grafana :3300</text>
  <text x="825" y="562" fill="#8fa0ba" font-size="12" text-anchor="middle">throughput · rule hits · latency p50/p95/p99 · label counts</text>
  <text x="825" y="580" fill="#8fa0ba" font-size="12" text-anchor="middle">scrapes detector :9100 · scorer :9101 · api /metrics</text>

  <!-- ============ flows: main pipeline ============ -->
  <line x1="222" y1="166" x2="306" y2="166" stroke="#6b7d9b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="166" x2="586" y2="166" stroke="#6b7d9b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="548" y="158" fill="#8fa0ba" font-size="11" text-anchor="middle">consume</text>

  <path d="M 620 108 C 570 78, 510 92, 468 138" fill="none" stroke="#6b7d9b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="524" y="88" fill="#8fa0ba" font-size="11" text-anchor="middle">publish fraud-alerts.v1</text>

  <line x1="1020" y1="166" x2="1096" y2="166" stroke="#6b7d9b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- detector <-> redis -->
  <path d="M 620 222 L 620 268 L 540 268 L 540 348 L 514 348" fill="none" stroke="#6b7d9b" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="560" y="260" fill="#8fa0ba" font-size="11" text-anchor="middle">features read/write</text>

  <!-- scorer reads redis -->
  <line x1="514" y1="392" x2="586" y2="392" stroke="#6b7d9b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="550" y="384" fill="#8fa0ba" font-size="11" text-anchor="middle">read</text>

  <!-- scorer publishes scores -->
  <path d="M 660 328 C 610 300, 540 268, 470 246" fill="none" stroke="#6b7d9b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="560" y="292" fill="#8fa0ba" font-size="11" text-anchor="middle">publish fraud-scores.v1</text>

  <!-- detector joins scores -->
  <line x1="740" y1="328" x2="740" y2="226" stroke="#6b7d9b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="752" y="282" fill="#8fa0ba" font-size="11">join ml_score</text>

  <!-- detector dual-write to pg -->
  <path d="M 820 178 L 848 178 L 848 348 L 876 348" fill="none" stroke="#6b7d9b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="852" y="170" fill="#8fa0ba" font-size="11" text-anchor="middle">dual-write</text>

  <!-- api <-> postgres -->
  <line x1="970" y1="222" x2="970" y2="326" stroke="#6b7d9b" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- metrics stubs -->
  <path d="M 705 224 L 705 268 L 820 268 L 820 506" fill="none" stroke="#2f4a3a" stroke-width="1.4" stroke-dasharray="3 4"/>
  <path d="M 705 452 L 705 508" fill="none" stroke="#2f4a3a" stroke-width="1.4" stroke-dasharray="3 4"/>
  <path d="M 970 452 L 970 508" fill="none" stroke="#2f4a3a" stroke-width="1.4" stroke-dasharray="3 4"/>

  <!-- footer -->
  <text x="32" y="650" fill="#8fa0ba" font-size="13">flow:  generator → transactions.v1 → detector ⇄ Redis features → 8 rules → risk ≥ 70 → fraud-alerts.v1 + Postgres</text>
  <text x="32" y="674" fill="#8fa0ba" font-size="13">ml loop:  training_examples → LogisticRegression vs HistGradientBoosting → model.pkl → fraud-scores.v1 → joined into alerts</text>
  <text x="32" y="702" fill="#46536b" font-size="12">consumer groups: detector · ml-scorer (independent replay/scale)   ·   card-id message keys keep per-card state consistent across partitions</text>
</svg>
